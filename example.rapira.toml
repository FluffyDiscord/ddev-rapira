# Example Rapira config for a DDEV project. Copy it to your project root as
# rapira.toml and edit your copy — this add-on never writes or manages that file.
#
# Without a rapira.toml the add-on runs Rapira in classic mode against your docroot's
# index.php, which serves any PHP application unchanged. This file is the next step:
# a config you own, still in classic mode, ready to switch to a resident worker.
#
# The add-on serves this file as-is. nginx proxies to 127.0.0.1:8000, which is Rapira's
# default listen address, so leave [http] listen out or keep it on port 8000.
#
# To load a differently-named file instead:
#     ddev dotenv set .ddev/.env.web --rapira-config-file=rapira.dev.toml && ddev restart

[http]
max_body_size_mb = 20

[http.pool]
# classic re-runs the entrypoint per request, so every save is live. Switch to
# "dispatcher" for a resident worker — that needs framework support, and after a code
# change you run `ddev rapira-restart`.
mode = "classic"
# Relative paths resolve against this file's directory.
entrypoint = "public/index.php"
# Rapira's own default is the CPU count. One worker keeps a machine running several
# DDEV projects predictable; raise it if your requests block on each other.
processes = 1

[log]
level = "info"
format = "plain"
